name: versificator
description: Checks a Flutter app's version against Firestore and tells it whether an update is required or recommended.
version: 1.0.4
repository: https://github.com/kamora/versificator

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.0.2
  firebase_auth: ^6.1.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
